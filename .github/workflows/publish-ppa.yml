name: Publish PPA
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      PPA_GPG_PRIVATE_KEY:
        required: true
      PPA_GPG_PASSPHRASE:
        required: true

jobs:
  ppa:
    name: Update PPA Package
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-x86_64
          path: artifacts

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dput

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
        id: import_gpg

      - name: Set GPG fingerprint
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d: -f10)
          echo "GPG_FINGERPRINT=${FINGERPRINT}" >> "$GITHUB_ENV"

      - name: Build and upload for each series
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"

          # Extract the release tarball to get the binary
          STARTDIR="$(pwd)"
          tar xzf "artifacts/AetherTune-${TAG}-linux-x86_64.tar.gz"

          FIRST=true
          for SERIES in noble jammy; do
            echo "=== Building for ${SERIES} ==="
            WORKDIR="/tmp/${SERIES}"
            mkdir -p "${WORKDIR}"

            # Create source directory
            mkdir -p "${WORKDIR}/aethertune-${VERSION}"
            cp "AetherTune-${TAG}-linux-x86_64/AetherTune" "${WORKDIR}/aethertune-${VERSION}/aethertune"
            cp "AetherTune-${TAG}-linux-x86_64/LICENSE" "${WORKDIR}/aethertune-${VERSION}/"
            cp "AetherTune-${TAG}-linux-x86_64/README.md" "${WORKDIR}/aethertune-${VERSION}/"

            # Create orig tarball
            cd "${WORKDIR}"
            tar czf "aethertune_${VERSION}.orig.tar.gz" "aethertune-${VERSION}"

            # Copy debian directory
            cp -r "${GITHUB_WORKSPACE}/debian" "aethertune-${VERSION}/debian"

            # Update changelog for this series
            cd "aethertune-${VERSION}"
            cat > debian/changelog <<CHLOG
          aethertune (${VERSION}-ppa${{ github.run_number }}~${SERIES}) ${SERIES}; urgency=medium

            * Release v${VERSION}

           -- sineyed <sineyed@users.noreply.github.com>  $(date -R)
          CHLOG
            sed -i 's/^          //' debian/changelog

            # First series includes orig tarball (-sa), subsequent reuse it (-sd)
            if [ "$FIRST" = true ]; then
              dpkg-buildpackage -S -sa -d -k"${GPG_FINGERPRINT}"
              FIRST=false
            else
              dpkg-buildpackage -S -sd -d -k"${GPG_FINGERPRINT}"
            fi

            # Upload to PPA. Launchpad's FTP upload endpoint occasionally
            # returns a transient error (e.g. "550 ... internal server
            # error") that has nothing to do with the package itself —
            # retry a few times with a short backoff before giving up, so
            # a one-off Launchpad hiccup doesn't require a manual re-run.
            cd "${WORKDIR}"
            CHANGES_FILE="aethertune_${VERSION}-ppa${{ github.run_number }}~${SERIES}_source.changes"
            UPLOAD_OK=false
            for ATTEMPT in 1 2 3; do
              if dput ppa:patchgoblin/aethertune "${CHANGES_FILE}"; then
                UPLOAD_OK=true
                break
              fi
              echo "dput attempt ${ATTEMPT}/3 failed for ${SERIES}; retrying in 30s..."
              sleep 30
            done
            if [ "$UPLOAD_OK" != true ]; then
              echo "::error::dput failed for ${SERIES} after 3 attempts"
              exit 1
            fi

            cd "${STARTDIR}"
          done